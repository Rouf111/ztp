generators:
# This is common to all RAN deployments
- common-ranGen.yaml
# This group policy is for all single-node deployments.
- group-du-sno-ranGen.yaml
# This group validator policy is for all single-node deployments.
- group-du-sno-validator-ranGen.yaml
- group-du-sno-ranGen-workers.yaml
# These are ves that should be replicated for every individual site. Use just one for each cluster configuration.
- ve-sno-site.yaml
- ve-sno-site-workers.yaml

